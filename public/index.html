<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- HERE Maps SDK - ALL scripts MUST be same version (3.1) -->
    <!-- Load with defer to prevent blocking -->
    <script src="https://js.api.here.com/v3/3.1/mapsjs-core.js" defer></script>
    <script
      src="https://js.api.here.com/v3/3.1/mapsjs-service.js"
      defer
    ></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-ui.js" defer></script>
    <script
      src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js"
      defer
    ></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://js.api.here.com/v3/3.1/mapsjs-ui.css"
    />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>SameWay</title>

    <!-- Error handling for WebGL issues -->
    <script>
      // Catch all errors before React does
      window.addEventListener(
        "error",
        function (event) {
          if (
            event.error &&
            event.error.message &&
            event.error.message.includes("getExtension")
          ) {
            console.warn(
              "⚠️ WebGL extension error detected - this is usually a timing issue"
            );
            console.warn("Map will retry initialization...");
            event.preventDefault();
          }
        },
        true
      );
    </script>

    <!-- Simplified debug script -->
    <script>
      // Set a global flag when SDK is loaded
      window.HERE_SDK_LOADED = false;

      // Wait for all scripts to load
      window.addEventListener("load", function () {
        console.log("📦 All page resources loaded");

        // Check if HERE SDK is available
        const checkHERE = setInterval(function () {
          if (window.H && window.H.service && window.H.Map && window.H.ui) {
            clearInterval(checkHERE);
            window.HERE_SDK_LOADED = true;
            console.log("✅ HERE SDK fully loaded and ready");

            // Dispatch custom event that React can listen to
            const event = new CustomEvent("hereSdkLoaded", { detail: true });
            window.dispatchEvent(event);
          }
        }, 100);

        // Stop checking after 10 seconds
        setTimeout(function () {
          clearInterval(checkHERE);
          if (!window.HERE_SDK_LOADED) {
            console.error("❌ HERE SDK failed to load after 10 seconds");
          }
        }, 10000);
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
